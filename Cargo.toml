[workspace]
resolver = "3"
members = [
    "crates/nats",
    "crates/postgres",
    "crates/primitives",
    "crates/telemetry",
    "services/indexer",
    "services/core-api",
    "services/ledger",
    "services/risk-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
alloy-rlp = "0.3.16"
solana-transaction = { version = "5", features = ["wincode"] }
solana-message = { version = "5", features = ["wincode"] }
wincode = "0.6"
anyhow = "1"
async-nats = "0.50"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bs58 = "0.5"
ed25519-dalek = "2.2"
chrono = { version = "0.4", features = ["serde"] }
clap = "4"
cookie = "0.18"
cpu-time = "1"
dotenvy = "0.15"
envy = "0.4"
ethnum = "1.5"
futures-util = "0.3"
hex = "0.4"
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["aws_lc_rs"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
metrics = "0.24"
moka = { version = "0.12.16", default-features = false }
metrics-exporter-prometheus = { version = "0.17", default-features = false }
pretty_assertions = "1"
prost = "0.14"
protoc-bin-vendored = "3"
p256 = "0.13"
rayon = "1.11"
reqwest = { version = "0.12", default-features = false }
rmp-serde = "1.3"
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
sqlx = { version = "0.8", default-features = false }
stats_alloc = "0.1"
subtle = "2"
strum = "0.27"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tokio-stream = "0.1"
tokio-tungstenite = "0.27"
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-webpki-roots", "zstd"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower-http = "0.6"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
utoipa = "5.5"
zstd = "0.13"

risk-engine = { path = "services/risk-engine" }
tackt-nats = { path = "crates/nats" }
tackt-postgres = { path = "crates/postgres" }
tackt-primitives = { path = "crates/primitives" }
tackt-telemetry = { path = "crates/telemetry" }
tackt-ledger = { path = "services/ledger" }
tackt-indexer = { path = "services/indexer" }
tackt-core-api = { path = "services/core-api" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
