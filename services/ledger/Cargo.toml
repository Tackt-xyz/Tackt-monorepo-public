[package]
name = "tackt-ledger"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
thiserror.workspace = true
axum.workspace = true
chrono.workspace = true
hex.workspace = true
sha2.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
strum = { workspace = true, features = ["derive"] }
subtle.workspace = true
tackt-postgres.workspace = true
tackt-nats.workspace = true
tackt-primitives.workspace = true
tackt-telemetry.workspace = true
tokio = { workspace = true, features = ["net"] }
tower = { workspace = true, features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { workspace = true, features = ["timeout", "trace"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tackt-indexer.workspace = true
url.workspace = true
tackt-postgres = { workspace = true, features = ["test-support"] }
